[package]
name = "klasync"
version = "0.1.0"
description = "Assistive learning platform host for higher education"
authors = ["you"]
edition = "2021"

[lib]
name = "klasync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", default-features = false , features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry"] }
tauri-plugin-opener = "2"
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread"] }

[profile.dev]
opt-level = 0
debug = 1
incremental = true
codegen-units = 256
split-debuginfo = "unpacked"  # avoid monolithic PDB merge — major linker speedup on Windows

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
