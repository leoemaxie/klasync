name: CI

# Fast feedback on pull requests, and a safety net on main. Releases are
# built by release.yml; this workflow never publishes anything.
#
# Jobs only run when the files they cover changed (see the `changes` job):
#   pull requests  frontend / backend / desktop / e2e, each only if its paths changed
#   push to main   only e2e (the PR already ran the other checks), if its paths changed
#   manual run     everything
# `CI passed` treats skipped jobs as success, so it stays usable as the single
# required check in branch protection.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only token: nothing here needs to write to the repository.
permissions:
  contents: read

# A newer push to the same PR supersedes the older run; main is never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The backend's query! macros read the committed .sqlx cache instead of
  # needing a live database (same as the Docker build).
  SQLX_OFFLINE: 'true'

jobs:
  # ── Which parts of the repo did this change touch? ─────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      desktop: ${{ steps.filter.outputs.desktop }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7

      # Editing this file re-runs everything. `desktop` embeds the built site,
      # so it also includes every frontend path (the desktop job downloads the
      # frontend job's artifact, which therefore always runs alongside it).
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            workflow: &workflow
              - '.github/workflows/ci.yml'
            frontend: &frontend
              - *workflow
              - 'src/**'
              - 'static/**'
              - 'index.html'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'svelte.config.js'
              - 'vite.config.ts'
              - 'vitest.config.ts'
              - 'tsconfig.json'
              - '.prettierrc'
            desktop:
              - *frontend
              - 'src-tauri/**'
            backend: &backend
              - *workflow
              - 'backend/**'
            e2e:
              - *backend
              - 'scripts/e2e.py'
              - 'scripts/gen-dev-certs.sh'
              - 'docker-compose.yml'
              - 'deploy/**'

  # ── Frontend: format, types, unit tests, production build ──────────────────
  frontend:
    name: Frontend
    needs: changes
    if: github.event_name != 'push' && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # The pnpm version comes from package.json's "packageManager" field, so
      # local, CI and release builds agree.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm format:check

      - name: Types (svelte-check)
        run: pnpm check --threshold error

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      # The desktop job compiles against the built site (tauri embeds it).
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: build/
          retention-days: 1
          if-no-files-found: error

  # ── Backend: format, lint, unit tests, build ───────────────────────────────
  backend:
    name: Backend
    needs: changes
    if: github.event_name != 'push' && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      # Tests that need a live model are #[ignore]d; they run by hand.
      - name: Unit tests
        run: cargo test --locked

  # ── Desktop shell: must compile and link on Linux ──────────────────────────
  desktop:
    name: Desktop (Tauri, Linux)
    needs: [changes, frontend]
    if: github.event_name != 'push' && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.desktop == 'true')
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # tauri::generate_context! embeds ../build at compile time.
      - uses: actions/download-artifact@v8
        with:
          name: frontend-build
          path: build

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # --locked fails if Cargo.lock is out of date with Cargo.toml.
      - name: Compile and link
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml

      - name: Lint
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml -- -D warnings

  # ── API lifecycle against the real stack (no AI provider) ──────────────────
  e2e:
    name: API lifecycle (e2e)
    # On pull requests this waits for the backend job (fail fast); on main the
    # backend job is skipped, so a skipped backend must not block it.
    needs: [changes, backend]
    if: >-
      ${{ !cancelled()
      && needs.changes.result == 'success'
      && (needs.backend.result == 'success' || needs.backend.result == 'skipped')
      && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.e2e == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_SKIP_AI: '1'
      SQLX_OFFLINE: 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Build backend
        working-directory: backend
        run: cargo build --locked

      # Postgres (pgvector), TLS Redis and an S3 mock, exactly as in
      # docker-compose.yml; the backend itself runs natively below.
      - name: Start dependencies
        run: |
          sh scripts/gen-dev-certs.sh
          docker compose up -d --wait postgres redis s3

      - name: Start backend
        working-directory: backend
        run: |
          cat /etc/ssl/certs/ca-certificates.crt ../deploy/certs/ca.crt > "$RUNNER_TEMP/ca-bundle.crt"
          export DATABASE_URL=postgres://klasync:klasync-dev@127.0.0.1:5432/klasync \
                 JWT_SECRET=ci-only-secret-0123456789abcdef0123456789 \
                 UNIVERSITY_EMAIL_DOMAIN=university.edu \
                 PUBLIC_APP_URL=http://localhost:1420 \
                 CORS_ALLOWED_ORIGINS=http://localhost:1420 \
                 REDIS_URL=rediss://127.0.0.1:6380 \
                 REDIS_KEY_PREFIX=klasync:ci \
                 SSL_CERT_FILE="$RUNNER_TEMP/ca-bundle.crt" \
                 HTTP_EXTRA_CA_FILE="$RUNNER_TEMP/ca-bundle.crt" \
                 R2_ENDPOINT=http://127.0.0.1:9090 R2_BUCKET=klasync-lectures \
                 R2_ACCESS_KEY_ID=klasync R2_SECRET_ACCESS_KEY=klasync-dev-secret \
                 AI_DAILY_BUDGET_USD=0 HOST=127.0.0.1 PORT=8787
          nohup ./target/debug/klasync-backend > "$RUNNER_TEMP/backend.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8787/health/ready >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "backend did not become ready"; cat "$RUNNER_TEMP/backend.log"; exit 1

      - name: Run lifecycle checks
        run: |
          python3 -m pip install --quiet websockets
          python3 scripts/e2e.py

      - name: Backend log
        if: failure()
        run: cat "$RUNNER_TEMP/backend.log"

  # ── One required check for branch protection ──────────────────────────────
  ci-ok:
    name: CI passed
    if: always()
    needs: [changes, frontend, backend, desktop, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          if [ '${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}' = 'true' ]; then
            echo "A required job failed or was cancelled"; exit 1
          fi
