name: Release KLASYNC

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

env:
  VITE_API_URL: ${{ secrets.VITE_API_URL || vars.VITE_API_URL }}

jobs:
  build-frontend:
    name: Build Frontend (Svelte)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Inject frontend .env
        shell: bash
        run: |
          if [ -n "$VITE_API_URL" ]; then
            echo "VITE_API_URL=$VITE_API_URL" > .env
          fi
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || vars.VITE_API_URL }}

      - name: Build frontend static bundle
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || vars.VITE_API_URL }}
        run: pnpm build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: build/
          retention-days: 1

  build-desktop:
    name: Build Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    needs: build-frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-x86_64'
            os: macos-latest
          - platform: 'windows-x86_64'
            os: windows-latest
          - platform: 'linux-x86_64'
            os: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Optimize Windows Defender
        if: runner.os == 'Windows'
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true
        shell: powershell

      - name: Download pre-built frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: build

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Build desktop app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-C linker=rust-lld.exe' || '' }}
        with:
          tagName: ${{ inputs.release_tag || github.ref_name }}
          releaseName: 'KLASYNC ${{ inputs.release_tag || github.ref_name }}'
          releaseBody: 'Assistive Learning Platform for Higher Education.'
          releaseDraft: false
          prerelease: false
          args: --no-frontend-build

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download pre-built frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: build

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js (for Tauri CLI)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Tauri CLI
        run: pnpm install --frozen-lockfile

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Configure Android NDK
        run: |
          if [ -d "$ANDROID_HOME/ndk" ] && [ "$(ls -A $ANDROID_HOME/ndk 2>/dev/null)" ]; then
            NDK_PATH=$(ls -d $ANDROID_HOME/ndk/* | sort -V | tail -n 1)
            echo "Using pre-installed NDK at $NDK_PATH"
            echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          elif [ -n "$ANDROID_NDK_LATEST_HOME" ]; then
            echo "Using ANDROID_NDK_LATEST_HOME at $ANDROID_NDK_LATEST_HOME"
            echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          else
            echo "Installing NDK via sdkmanager..."
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125"
            echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          fi

      - name: Install Rust & Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Build Android APK
        run: pnpm tauri android build --apk --no-frontend-build
        env:
          NDK_HOME: ${{ env.NDK_HOME }}
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.jvmargs=-Xmx4g"

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: |
            src-tauri/gen/android/app/build/outputs/apk/arm64/release/*.apk
            src-tauri/gen/android/app/build/outputs/apk/x86_64/release/*.apk
            src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
            src-tauri/gen/android/app/build/outputs/apk/single/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
